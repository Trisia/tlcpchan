# TLCP Channel 默认配置文件
# 
# 该文件是 TLCP Channel 的主配置文件，包含服务端配置、代理实例列表和密钥存储配置
# 
# 配置说明:
# - server: 服务端配置，包含 API、UI 和日志设置
# - keystores: 密钥存储配置列表
# - instances: 代理实例配置列表，每个实例代表一个独立的代理服务
# - mcp: MCP 服务配置（可选）

# 服务端配置
server:
  # API 服务配置
  api:
    # API 服务监听地址，格式: "host:port" 或 ":port"
    # 示例: ":20080" 表示监听所有网卡的 20080 端口
    address: ":20080"
  
  # 日志配置（可选）
  log:
    # 日志级别，可选值: "debug", "info", "warn", "error"
    level: "info"
    # 日志文件路径，为空则仅输出到控制台
    file: "./logs/tlcpchan.log"
    # 单个日志文件最大大小，单位: MB
    max-size: 100
    # 保留的旧日志文件最大数量，单位: 个
    max-backups: 5
    # 保留旧日志文件的最大天数，单位: 天
    max-age: 30
    # 是否压缩旧日志文件
    compress: true
    # 是否启用日志
    enabled: true

# 密钥存储配置列表
keystores:
  # 示例: 使用默认自动生成的密钥存储
  # - name: "default"
  #   type: "auto"
  #   params:
  #     workdir: "./keystores"
  #
  # 示例: IBC（SM9）身份，需先在 IBC 信任池（ibcparams/）中预置对应 KGC 公共参数
  # - name: "my-ibc"
  #   type: "ibc-file"
  #   params:
  #     identity: "./keystores/my-ibc-identity.txt"  # 本端标识（裸字节文本）
  #     params: "./keystores/my-ibc-params.pem"      # KGC 公共参数
  #     sign-key: "./keystores/my-ibc-sign.key"      # 签名私钥 hid=0x01
  #     enc-key: "./keystores/my-ibc-enc.key"        # 加密私钥 hid=0x03
  #     kex-key: "./keystores/my-ibc-kex.key"        # 密钥交换私钥 hid=0x02

# 代理实例配置列表
# 示例: 创建一个 TLCP 服务端代理实例
# instances:
#   - name: "example-tlcp-server"
#     type: "server"
#     listen: ":8443"
#     target: "192.168.1.100:443"
#     protocol: "tlcp"
#     enabled: false
#     tlcp:
#       client-auth-type: "no-client-cert"
#       min-version: "1.1"
#       max-version: "1.1"
#       # 可选密码套件列表，IBC/IBSDH 套件默认关闭、需显式列出且配合 ibc-keystore 使用:
#       # IBC_SM4_GCM_SM3 / IBC_SM4_CBC_SM3 / IBSDH_SM4_GCM_SM3 / IBSDH_SM4_CBC_SM3
#       cipher-suites:
#         - "ECC_SM4_GCM_SM3"
#         - "ECDHE_SM4_GCM_SM3"
#       keystore:
#         name: "default"
#         type: "auto"
#         params:
#           workdir: "./keystores"
#       # 可选: IBC（SM9）身份密钥存储，与证书身份可同时配置以实现混合协商
#       # ibc-keystore:
#       #   type: "named"
#       #   params:
#       #     name: "my-ibc"

# MCP 服务配置（可选）
# mcp:
#   # 是否启用 MCP 服务
#   enabled: false
#   # MCP 服务 API 密钥，为空表示无需认证
#   api_key: ""
